name = "emby-account-manager"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# 不写 id：部署时（手动 wrangler deploy 或 Dashboard Git 构建）自动创建 KV 命名空间。
[[kv_namespaces]]
binding = "KV"

# 可选配置（部署后在 Worker 的 Settings → Variables and Secrets 中添加，均可留空）：
#   ACCESS_PASSWORD  面板访问密码；不设置则无需密码
#   ENCRYPT_KEY      Emby 密码加密密钥（`openssl rand -hex 32` 生成）；不设置则明文存储
