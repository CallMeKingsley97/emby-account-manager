name = "emby-account-manager"
main = "src/worker.js"
compatibility_date = "2024-12-01"

# 不写 id：部署时（手动 wrangler deploy 或 Dashboard Git 构建）自动创建 KV 命名空间。
[[kv_namespaces]]
binding = "KV"

# 定时巡检：每小时触发一次，但每个账号只按面板「设置」中的频率（默认每天一次）被检查；
# 每小时触发是为了把账号分摊到不同时段，避免单次超出子请求上限。没有到期账号时只读 KV，不访问 Emby。
[triggers]
crons = ["0 * * * *"]

# 可选配置（部署后在 Worker 的 Settings → Variables and Secrets 中添加，均可留空）：
#   ACCESS_PASSWORD  面板访问密码；不设置则无需密码
#   ENCRYPT_KEY      Emby 密码加密密钥（`openssl rand -hex 32` 生成）；不设置则明文存储
#   TG_BOT_TOKEN + TG_CHAT_ID   巡检异常推送到 Telegram
#   BARK_URL         巡检异常推送到 Bark，形如 https://api.day.app/<key>
